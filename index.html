// ============ CONFIG ============
const firebaseConfig = {
  apiKey: "AIzaSyCkhVbKYq1qpwsGv6RQCc2aZndIHypMFgI",
  authDomain: "agorlab-55cf1.firebaseapp.com",
  projectId: "agorlab-55cf1",

};

const app = initializeApp(firebaseConfig);

const ADMIN_EMAIL = "cepedademian2005@gmail.com";

// ============ UTILS ============

function showToast(msg, type = 'info') {
  const t = $('toast');
  t.textContent = msg;
  t.className = `fixed bottom-6 right-6 z-[100] px-5 py-3 rounded-xl shadow-2xl text-sm font-medium animate-slide-up ${type === 'error' ? 'bg-red-600 text-white' : type === 'success' ? 'bg-emerald-600 text-white' : 'bg-ink text-white'}`;
  t.classList.remove('hidden');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.add('hidden'), 3500);
}

function openModal(id) {
  const m = $(id);
  m.classList.remove('hidden');
  m.classList.add('flex');
}
function closeModal(id) {
  const m = $(id);
  m.classList.add('hidden');
  m.classList.remove('flex');
}

// ============ AUTH ============
$('btn-google-login').addEventListener('click', async () => {

      Continuar con Google`;
  }
});

async function handleLogout() {
  try {
    await signOut(auth);
  } catch (err) {
    console.error(err);
  }
}

onAuthStateChanged(auth, (user) => {
  state.user = user;
  state.isAdmin = !!user && user.email === ADMIN_EMAIL;
  if (!user) openModal('modal-login');
  else closeModal('modal-login');
  renderUserArea();
  renderMain();
});

function renderUserArea() {
  const area = $('user-area');
  if (!state.user) {
    area.innerHTML = '';

  }
  area.innerHTML = `
    ${state.isAdmin ? `<span class="hidden sm:inline text-xs font-semibold text-rose-600 bg-rose-50 px-2 py-1 rounded-full">ADMIN</span>` : ''}
    <div class="flex items-center gap-2 pl-2 pr-1 py-1 bg-neutral-100 rounded-full">
      <img src="${state.user.photoURL || ''}" alt="" class="w-7 h-7 rounded-full border-2 border-white shadow" onerror="this.style.display='none'"/>
      <button id="btn-logout" class="p-1.5 hover:bg-neutral-200 rounded-full transition" title="Salir">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </button>
    </div>
  `;
  $('btn-logout').addEventListener('click', handleLogout);

// ============ PRODUCTS (Firestore realtime) ============
const productsRef = collection(db, 'products');
onSnapshot(productsRef, (snap) => {
  state.products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderMain();
}, (err) => {

});

// ============ RENDER: MAIN ============
function renderMain() {
  const main = $('main');
  if (!state.user) {
    main.innerHTML = `

        <h1 class="font-display font-bold text-5xl sm:text-7xl tracking-tight mb-6">Premium.<br/>Minimalista.</h1>
        <p class="text-neutral-500 max-w-xl mx-auto">Curamos productos excepcionales para personas que aprecian el detalle.</p>
      </div>
    `;
    return;
  }
  main.innerHTML = '';
  if (state.isAdmin) renderAdminPanel(main);
  renderCatalog(main);
  renderMyOrders(main);
}

// ============ RENDER: ADMIN PANEL ============
function renderAdminPanel(parent) {
  const section = document.createElement('section');
  section.className = 'mb-12';
  section.innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-display font-bold text-2xl">Panel de Administración</h2>
      <div class="flex bg-neutral-100 rounded-full p-1">
        <button data-tab="upload" class="admin-tab px-4 py-1.5 rounded-full text-sm font-medium ${state.adminTab === 'upload' ? 'bg-white shadow' : ''}">Subir producto</button>
        <button data-tab="orders" class="admin-tab px-4 py-1.5 rounded-full text-sm font-medium ${state.adminTab === 'orders' ? 'bg-white shadow' : ''}">Órdenes</button>
      </div>
    </div>
    <div id="admin-content" class="bg-ash rounded-2xl p-6 sm:p-8 border border-neutral-200"></div>
  `;
  parent.appendChild(section);

  section.querySelectorAll('.admin-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.adminTab = btn.dataset.tab;
      renderMain();
    });
  });

  const content = section.querySelector('#admin-content');
  if (state.adminTab === 'upload') renderUploadForm(content);
  else renderAdminOrders(content);
}

function renderUploadForm(parent) {
  parent.innerHTML = `
    <form id="form-upload" class="grid sm:grid-cols-2 gap-5">
      <div class="sm:col-span-2">
        <label class="text-sm font-medium text-neutral-700 block mb-1.5">Nombre del producto</label>
        <input name="name" required class="w-full border border-neutral-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-ink/20" placeholder="Ej: Auriculares Pro"/>
      </div>
      <div class="sm:col-span-2">
        <label class="text-sm font-medium text-neutral-700 block mb-1.5">Descripción</label>
        <textarea name="description" required rows="3" class="w-full border border-neutral-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-ink/20" placeholder="Descripción breve y atractiva..."></textarea>
      </div>
      <div>
        <label class="text-sm font-medium text-neutral-700 block mb-1.5">Precio (ARS)</label>
        <input name="price" type="number" min="0" required class="w-full border border-neutral-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-ink/20" placeholder="0"/>
      </div>
      <div>
        <label class="text-sm font-medium text-neutral-700 block mb-1.5">Imagen</label>
        <input name="image" type="file" accept="image/*" required class="w-full border border-neutral-300 rounded-xl px-4 py-2 bg-white file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-ink file:text-white file:text-sm file:font-medium"/>
      </div>
      <div class="sm:col-span-2 flex items-center justify-between gap-3 mt-2">
        <div id="upload-status" class="text-sm text-neutral-500"></div>
        <button type="submit" class="bg-ink text-white px-6 py-2.5 rounded-xl font-medium hover:bg-neutral-800 transition disabled:bg-neutral-400">
          Publicar producto
        </button>
      </div>
    </form>
  `;
  $('form-upload').addEventListener('submit', handleUploadProduct);
}

async function handleUploadProduct(e) {
  e.preventDefault();
  const form = e.target;
  const data = new FormData(form);
  const name = data.get('name').trim();
  const description = data.get('description').trim();
  const price = parseFloat(data.get('price'));
  const file = data.get('image');

  const btn = form.querySelector('button[type=submit]');
  const status = $('upload-status');
  btn.disabled = true;
  status.textContent = 'Subiendo imagen...';

  try {
    const storageRef = ref(storage, `products/${Date.now()}_${file.name}`);
    await uploadBytes(storageRef, file);
    const url = await getDownloadURL(storageRef);

    status.textContent = 'Guardando en la base de datos...';
    await addDoc(productsRef, {
      name, description, price, image: url,
      createdAt: serverTimestamp()
    });

    showToast('Producto publicado con éxito', 'success');
    form.reset();
    status.textContent = '';
  } catch (err) {
    console.error(err);
    showToast('Error al publicar: ' + err.message, 'error');
    status.textContent = 'Error';
  } finally {
    btn.disabled = false;
  }
}

async function renderAdminOrders(parent) {
  parent.innerHTML = '<div class="py-12 text-center text-neutral-500">Cargando órdenes...</div>';
  try {
    const q = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    if (orders.length === 0) {
      parent.innerHTML = '<div class="py-12 text-center text-neutral-500">Aún no hay órdenes.</div>';
      return;
    }

    parent.innerHTML = `
      <div class="space-y-3">
        ${orders.map(o => `
          <div class="bg-white border border-neutral-200 rounded-xl p-4 sm:p-5">
            <div class="flex flex-wrap items-start justify-between gap-3 mb-3">
              <div>
                <div class="font-semibold">${o.buyer?.name || 'Cliente'}</div>
                <div class="text-xs text-neutral-500">${o.buyer?.email || ''}</div>
                <div class="text-xs text-neutral-400 mt-1">CP: ${o.zip || '-'} · ${o.createdAt?.toDate ? new Date(o.createdAt.toDate()).toLocaleString('es-AR') : ''}</div>
              </div>
              <div class="text-right">
                <div class="font-display font-bold text-lg">${fmtMoney(o.total)}</div>
                <span class="text-xs inline-block px-2 py-0.5 rounded-full ${o.status === 'pending' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">${o.status || 'pending'}</span>
              </div>
            </div>
            <div class="border-t border-neutral-100 pt-3 space-y-1">
              ${o.items.map(it => `
                <div class="flex justify-between text-sm">
                  <span>${it.quantity}× ${it.name}</span>
                  <span class="text-neutral-600">${fmtMoney(it.price * it.quantity)}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } catch (err) {
    console.error(err);
    parent.innerHTML = `<div class="py-12 text-center text-red-500">Error al cargar órdenes: ${err.message}</div>`;
  }
}

            <div class="flex items-start justify-between gap-3 mb-2">
              <h3 class="font-display font-semibold text-lg leading-tight">${p.name}</h3>
              <div class="font-bold whitespace-nowrap">${fmtMoney(p.price)}</div>
            </div>
            <p class="text-sm text-neutral-500 mb-4 line-clamp-2 min-h-[40px]">${p.description || ''}</p>
            <button class="btn-add-to-cart w-full bg-ink text-white py-2.5 rounded-xl text-sm font-medium hover:bg-neutral-800 transition" data-id="${p.id}">
              Agregar al carrito
            </button>
          </div>
        </article>
      `).join('')}
    </div>
  `;
  parent.appendChild(section);

  section.querySelectorAll('.btn-add-to-cart').forEach(btn => {
    btn.addEventListener('click', () => addToCart(btn.dataset.id));
  });
}

// ============ RENDER: MY ORDERS ============
function renderMyOrders(parent) {
  if (!state.user) return;
  const section = document.createElement('section');
  section.id = 'my-orders-section';
  section.innerHTML = `
    <div class="mb-6">
      <h2 class="font-display font-bold text-2xl">Mis órdenes</h2>
      <p class="text-neutral-500 text-sm">Tu historial de compras.</p>
    </div>
    <div id="my-orders-content" class="bg-ash rounded-2xl p-6 border border-neutral-200">
      <div class="py-8 text-center text-neutral-500 text-sm">Cargando...</div>
    </div>
  `;
  parent.appendChild(section);

  const q = query(
    collection(db, 'orders'),
    where('buyer.uid', '==', state.user.uid),
    orderBy('createdAt', 'desc')
  );
  onSnapshot(q, (snap) => {
    const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const container = $('my-orders-content');
    if (orders.length === 0) {
      container.innerHTML = '<div class="py-8 text-center text-neutral-500 text-sm">Aún no has realizado ninguna compra.</div>';
      return;
    }
    container.innerHTML = `<div class="space-y-3">${orders.map(o => `
      <div class="bg-white border border-neutral-200 rounded-xl p-4">
        <div class="flex items-center justify-between mb-2">
          <div class="text-xs text-neutral-500">${o.createdAt?.toDate ? new Date(o.createdAt.toDate()).toLocaleString('es-AR') : ''}</div>
          <span class="text-xs px-2 py-0.5 rounded-full ${o.status === 'approved' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${o.status || 'pending'}</span>
        </div>
        <div class="font-semibold">${o.items.length} ${o.items.length === 1 ? 'producto' : 'productos'} · ${fmtMoney(o.total)}</div>
        <div class="text-xs text-neutral-400 mt-1">CP: ${o.zip || '-'}</div>
      </div>
    `).join('')}</div>`;
  }, (err) => {
    console.error(err);
    $('my-orders-content').innerHTML = `<div class="py-8 text-center text-red-500 text-sm">Error al cargar tu historial.</div>`;
  });
}

// ============ CART ============
function addToCart(productId) {
  const p = state.products.find(x => x.id === productId);
  if (!p) return;
  const existing = state.cart.find(x => x.id === productId);
  if (existing) existing.quantity++;
  else state.cart.push({ id: p.id, name: p.name, price: p.price, image: p.image, quantity: 1 });
  saveCart();
  updateCartBadge();
  showToast(`${p.name} añadido`, 'success');
}

function updateCartQty(id, delta) {
  const item = state.cart.find(x => x.id === id);
  if (!item) return;
  item.quantity += delta;
  if (item.quantity <= 0) state.cart = state.cart.filter(x => x.id !== id);
  saveCart();
  renderCart();
  updateCartBadge();
}

function removeFromCart(id) {
  state.cart = state.cart.filter(x => x.id !== id);
  saveCart();
  renderCart();
  updateCartBadge();
}

function cartTotal() {
  return state.cart.reduce((acc, it) => acc + it.price * it.quantity, 0);
}

function cartCount() {
  return state.cart.reduce((acc, it) => acc + it.quantity, 0);
}

function updateCartBadge() {
  const badge = $('cart-badge');
  const count = cartCount();
  if (count > 0) {
    badge.textContent = count;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function renderCart() {
  const items = $('cart-items');
  const footer = $('cart-footer');

  if (state.cart.length === 0) {
    items.innerHTML = `
      <div class="text-center py-16">
        <div class="text-5xl mb-4">🛒</div>
        <p class="text-neutral-500">Tu carrito está vacío.</p>
      </div>
    `;
    footer.innerHTML = '';
    return;
  }

  items.innerHTML = `<div class="space-y-4">${state.cart.map(it => `
    <div class="flex gap-3 pb-4 border-b border-neutral-100 last:border-0">
      <img src="${it.image}" class="w-16 h-16 rounded-lg object-cover bg-ash" onerror="this.src='https://via.placeholder.com/64'"/>
      <div class="flex-1 min-w-0">
        <div class="flex items-start justify-between gap-2">
          <div class="font-medium text-sm truncate">${it.name}</div>
          <button class="btn-remove-cart text-neutral-400 hover:text-red-500 transition flex-shrink-0" data-id="${it.id}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a2 2 0 012-2h2a2 2 0 012 2v3"/></svg>
          </button>
        </div>
        <div class="text-sm text-neutral-500 mt-0.5">${fmtMoney(it.price)}</div>
        <div class="flex items-center gap-2 mt-2">
          <button class="btn-qty w-7 h-7 rounded-lg border border-neutral-300 hover:bg-neutral-100 transition flex items-center justify-center" data-id="${it.id}" data-delta="-1">−</button>
          <span class="text-sm font-medium w-6 text-center">${it.quantity}</span>
          <button class="btn-qty w-7 h-7 rounded-lg border border-neutral-300 hover:bg-neutral-100 transition flex items-center justify-center" data-id="${it.id}" data-delta="1">+</button>
          <span class="ml-auto text-sm font-semibold">${fmtMoney(it.price * it.quantity)}</span>
        </div>
      </div>
    </div>
  `).join('')}</div>`;

  footer.innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <span class="text-neutral-600">Subtotal</span>
      <span class="font-display font-bold text-xl">${fmtMoney(cartTotal())}</span>
    </div>
    <button id="btn-checkout" class="w-full bg-ink text-white py-3 rounded-xl font-medium hover:bg-neutral-800 transition">
      Continuar con la compra
    </button>
    <p class="text-xs text-neutral-400 text-center mt-3">Envío calculado en el siguiente paso.</p>
  `;

  items.querySelectorAll('.btn-qty').forEach(b => {
    b.addEventListener('click', () => updateCartQty(b.dataset.id, parseInt(b.dataset.delta)));
  });
  items.querySelectorAll('.btn-remove-cart').forEach(b => {
    b.addEventListener('click', () => removeFromCart(b.dataset.id));
  });
  $('btn-checkout').addEventListener('click', openCheckout);
}

function openCheckout() {
  closeModal('modal-cart');
  $('input-zip').value = '';
  $('zip-message').innerHTML = '';
  $('zip-message').className = 'text-sm min-h-[20px] mb-4';
  $('btn-pay-mp').disabled = true;
  openModal('modal-checkout');
  setTimeout(() => $('input-zip').focus(), 100);
}

// ============ CART MODAL EVENTS ============
$('btn-cart').addEventListener('click', () => {
  if (!state.user) {
    showToast('Inicia sesión para ver tu carrito');
    openModal('modal-login');
    return;
  }
  renderCart();
  openModal('modal-cart');
});
$('btn-close-cart').addEventListener('click', () => closeModal('modal-cart'));
$('cart-backdrop').addEventListener('click', () => closeModal('modal-cart'));
$('btn-close-checkout').addEventListener('click', () => closeModal('modal-checkout'));

// ============ CHECKOUT (ZIP + MP) ============
$('input-zip').addEventListener('input', (e) => {
  const zip = e.target.value.replace(/\D/g, '').slice(0, 4);
  e.target.value = zip;
  const msg = $('zip-message');
  const btn = $('btn-pay-mp');
  if (!zip) {
    msg.innerHTML = '';
    btn.disabled = true;
    return;
  }
  if (zip.length < 4) {
    msg.innerHTML = '';
    btn.disabled = true;
    return;
  }
  if (VALID_ZIPS.includes(zip)) {
    msg.innerHTML = `<span class="text-emerald-600 font-medium">✓ Envío Express Nacional habilitado para tu zona.</span>`;
    msg.className = 'text-sm min-h-[20px] mb-4 text-emerald-600';
    btn.disabled = false;
  } else {
    msg.innerHTML = `<span class="text-red-600 font-medium">✗ Temporalmente sin stock en el centro de distribución asignado a tu zona.</span>`;
    msg.className = 'text-sm min-h-[20px] mb-4 text-red-600';
    btn.disabled = true;
  }
});

$('btn-pay-mp').addEventListener('click', handlePayWithMP);

async function handlePayWithMP() {
  if (!state.user) {
    showToast('Debes iniciar sesión');
    return;
  }
  const zip = $('input-zip').value;
  if (!VALID_ZIPS.includes(zip)) {
    showToast('Código postal no válido', 'error');
    return;
  }

  const btn = $('btn-pay-mp');
  btn.disabled = true;
  btn.textContent = 'Procesando...';

  try {
    // 1. Guardar orden en Firestore
    const orderData = {
      items: state.cart.map(it => ({
        id: it.id, name: it.name, price: it.price, quantity: it.quantity
      })),
      total: cartTotal(),
      zip,
      buyer: {
        uid: state.user.uid,
        name: state.user.displayName,
        email: state.user.email
      },
      status: 'pending',
      createdAt: serverTimestamp()
    };
    const orderRef = await addDoc(collection(db, 'orders'), orderData);

    // 2. Crear preferencia en Mercado Pago
    const mpItems = state.cart.map(it => ({
      id: it.id,
      title: it.name,
      description: it.name,
      picture_url: it.image,
      category_id: 'general',
      quantity: it.quantity,
      currency_id: 'ARS',
      unit_price: Number(it.price)
    }));

    const preferenceBody = {
      items: mpItems,
      payer: {
        name: state.user.displayName?.split(' ')[0] || 'Cliente',
        surname: state.user.displayName?.split(' ').slice(1).join(' ') || '',
        email: state.user.email
      },
      external_reference: orderRef.id,
      back_urls: {
        success: window.location.origin + window.location.pathname,
        failure: window.location.origin + window.location.pathname,
        pending: window.location.origin + window.location.pathname
      },
      auto_return: 'approved',
      metadata: {
        zip: zip,
        buyer_uid: state.user.uid
      }
    };

    let initPoint = null;
    try {
      const mpRes = await fetch('https://api.mercadopago.com/checkout/preferences', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${MP_ACCESS_TOKEN}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(preferenceBody)
      });

      if (mpRes.ok) {
        const mpData = await mpRes.json();
        initPoint = mpData.init_point;
      } else {
        console.warn('MP response no OK:', await mpRes.text());
      }
    } catch (fetchErr) {
      // Posible bloqueo CORS: MP no permite crear preferencias desde el navegador
      console.warn('Error al crear preferencia MP (posible CORS):', fetchErr);
    }

    // Cerrar modal y limpiar carrito
    closeModal('modal-checkout');
    state.cart = [];
    saveCart();
    updateCartBadge();

    if (initPoint) {
      showToast('Redirigiendo a Mercado Pago...', 'success');
      setTimeout(() => window.location.href = initPoint, 800);
    } else {
      showToast('Pedido registrado. Mercado Pago no pudo generar el checkout (CORS). Contacta soporte.', 'info');
      // Opcional: podrías redirigir a un flujo alternativo
      setTimeout(() => renderMain(), 1500);
    }

  } catch (err) {
    console.error(err);
    showToast('Error al procesar el pago: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Pagar con Mercado Pago';
  }
}

// ============ INIT ============
updateCartBadge();
renderMain();

</script>
